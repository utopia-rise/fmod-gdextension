name: 🌈 CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  # Builds master daily: the only runs that save the caches, which every other run restores (master-cache action).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Mirrored by the jobs' inputs below through YAML anchors, since a reusable workflow call cannot read env.
  GODOT_VERSION: &godot_version 4.6.3-stable
  FMOD_VERSION: &fmod_version '20400'

jobs:
  # The FMOD SDK download needs the FMODUSER and FMODPASS secrets, which pull_request runs from forks do not get.
  # In-repo pull requests run on pull_request; external ones run on pull_request_target, which has the secrets, only
  # once a maintainer approves the external-pr environment. Every job below checks out the pull request's head commit.
  gate:
    name: 🚦 Gate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name != github.repository
      )
    environment: ${{ github.event_name == 'pull_request_target' && 'external-pr' || '' }}
    steps:
      - run: echo "Run approved"

  check-specs:
    name: 📜 Check specs
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python specs/check_specs.py

  build-linux:
    name: 🐧 Build Linux
    needs: gate
    uses: ./.github/workflows/build_linux.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-windows:
    name: 🪟 Build Windows
    needs: gate
    uses: ./.github/workflows/build_windows.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-macos:
    name: 🍎 Build macOS
    needs: gate
    uses: ./.github/workflows/build_macos.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-android:
    name: 🤖 Build Android
    needs: gate
    uses: ./.github/workflows/build_android.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-ios:
    name: 🍏 Build iOS
    needs: gate
    uses: ./.github/workflows/build_ios.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  assemble-android:
    name: 🤖 Assemble Android
    needs: build-android
    uses: ./.github/workflows/assemble_android.yml
    with:
      godot-version: *godot_version

  test-desktop:
    name: 🧪 Test
    needs: [build-linux, build-windows, build-macos]
    uses: ./.github/workflows/test_desktop.yml
    with:
      godot-version: *godot_version

  test-ios:
    name: 🍏 Test iOS
    needs: [build-ios, build-macos]
    uses: ./.github/workflows/test_ios.yml
    with:
      godot-version: *godot_version

  test-editor-monkey:
    name: 🐒 Editor monkey
    needs: build-linux
    uses: ./.github/workflows/test_editor_monkey.yml
    with:
      godot-version: *godot_version

  assemble-addon:
    name: 📦 Assemble addon
    needs: [assemble-android, test-desktop, test-ios, test-editor-monkey]
    uses: ./.github/workflows/assemble_addon.yml
