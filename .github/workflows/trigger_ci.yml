name: 🌈 CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Builds master weekly: the only runs that save the caches, which every other run restores (master-cache action).
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Mirrored by the jobs' inputs below through YAML anchors, since a reusable workflow call cannot read env.
  GODOT_VERSION: &godot_version 4.6.3-stable
  FMOD_VERSION: &fmod_version '20400'
  # The version that built the Godot web export templates: a side module built with another one can fail to load.
  EMSCRIPTEN_VERSION: &emscripten_version 4.0.20

jobs:
  fmod-sdk:
    name: 🎵 FMOD SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/fmod-sdk-cache
        with:
          mode: check
          fmod-version: *fmod_version

  check-specs:
    name: 📜 Check specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python specs/check_specs.py

  build-linux:
    name: 🐧 Build Linux
    needs: fmod-sdk
    uses: ./.github/workflows/build_linux.yml
    with:
      fmod-version: *fmod_version

  build-windows:
    name: 🪟 Build Windows
    needs: fmod-sdk
    uses: ./.github/workflows/build_windows.yml
    with:
      fmod-version: *fmod_version

  build-macos:
    name: 🍎 Build macOS
    needs: fmod-sdk
    uses: ./.github/workflows/build_macos.yml
    with:
      fmod-version: *fmod_version

  build-android:
    name: 🤖 Build Android
    needs: fmod-sdk
    uses: ./.github/workflows/build_android.yml
    with:
      fmod-version: *fmod_version

  build-ios:
    name: 🍏 Build iOS
    needs: fmod-sdk
    uses: ./.github/workflows/build_ios.yml
    with:
      fmod-version: *fmod_version

  build-web:
    name: 🌐 Build Web
    needs: fmod-sdk
    uses: ./.github/workflows/build_web.yml
    with:
      fmod-version: *fmod_version
      emscripten-version: *emscripten_version

  assemble-android:
    name: 🤖 Assemble Android
    needs: build-android
    uses: ./.github/workflows/assemble_android.yml
    with:
      godot-version: *godot_version

  test-desktop:
    name: 🧪 Test
    needs: [build-linux, build-windows, build-macos]
    uses: ./.github/workflows/test_desktop.yml
    with:
      godot-version: *godot_version

  test-ios:
    name: 🍏 Test iOS
    needs: [build-ios, build-macos]
    uses: ./.github/workflows/test_ios.yml
    with:
      godot-version: *godot_version

  test-editor-monkey:
    name: 🐒 Editor monkey
    needs: build-linux
    uses: ./.github/workflows/test_editor_monkey.yml
    with:
      godot-version: *godot_version

  test-web:
    name: 🌐 Test Web
    needs: [build-linux, build-web]
    uses: ./.github/workflows/test_web.yml
    with:
      godot-version: *godot_version

  assemble-addon:
    name: 📦 Assemble addon
    needs: [assemble-android, test-desktop, test-ios, test-editor-monkey, test-web]
    uses: ./.github/workflows/assemble_addon.yml
