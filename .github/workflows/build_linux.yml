name: 🐧 Linux Builds
on:
  workflow_call:
    inputs:
      fmod-version:
        type: string
        required: true

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }} ${{ matrix.arch }}
    permissions:
      contents: read
      actions: write
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    strategy:
      fail-fast: false
      matrix:
        target: [editor, template_debug, template_release]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/scons-cache
        with:
          mode: restore
          name: linux-${{ matrix.target }}-${{ matrix.arch }}
      - uses: ./.github/actions/gdextension-build
        with:
          platform: linux
          target: ${{ matrix.target }}
          scons-flags: arch=${{ matrix.arch }}
          fmod-version: ${{ inputs.fmod-version }}
      - uses: ./.github/actions/scons-cache
        if: always()
        with:
          mode: save
          name: linux-${{ matrix.target }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_linux_${{ matrix.arch }}
          path: |
            demo/addons/fmod/libs/linux
          if-no-files-found: error
