name: 🪟 Windows Builds
on:
  workflow_call:
    inputs:
      fmod-version:
        type: string
        required: true

jobs:
  build-windows:
    runs-on: windows-2022
    name: ${{ matrix.target }}
    permissions:
      contents: read
      actions: write
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    strategy:
      fail-fast: false
      matrix:
        target: [editor, template_debug, template_release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/scons-cache
        with:
          mode: restore
          name: windows-${{ matrix.target }}
      - uses: ./.github/actions/gdextension-build
        with:
          platform: windows
          target: ${{ matrix.target }}
          scons-flags: arch=x86_64
          fmod-version: ${{ inputs.fmod-version }}
      - uses: ./.github/actions/scons-cache
        if: always()
        with:
          mode: save
          name: windows-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_windows
          path: |
            demo/addons/fmod/libs/windows
            !demo/addons/fmod/libs/windows/CopyPast_Fmod_Libs_Here.txt
          if-no-files-found: error
