name: 🚀 Release
on:
  push:
    tags:
      - '*.*.*-*.*.*'

env:
  # Mirrored by the jobs' inputs below through YAML anchors, since a reusable workflow call cannot read env.
  GODOT_VERSION: &godot_version 4.6.3-stable
  FMOD_VERSION: &fmod_version '20400'

jobs:
  check-specs:
    name: 📜 Check specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python specs/check_specs.py

  build-linux:
    name: 🐧 Build Linux
    uses: ./.github/workflows/build_linux.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-windows:
    name: 🪟 Build Windows
    uses: ./.github/workflows/build_windows.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-macos:
    name: 🍎 Build macOS
    uses: ./.github/workflows/build_macos.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-android:
    name: 🤖 Build Android
    uses: ./.github/workflows/build_android.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  build-ios:
    name: 🍏 Build iOS
    uses: ./.github/workflows/build_ios.yml
    secrets: inherit
    with:
      fmod-version: *fmod_version

  assemble-android:
    name: 🤖 Assemble Android
    needs: build-android
    uses: ./.github/workflows/assemble_android.yml
    with:
      godot-version: *godot_version

  test-desktop:
    name: 🧪 Test
    needs: [build-linux, build-windows, build-macos]
    uses: ./.github/workflows/test_desktop.yml
    with:
      godot-version: *godot_version

  test-ios:
    name: 🍏 Test iOS
    needs: [build-ios, build-macos]
    uses: ./.github/workflows/test_ios.yml
    with:
      godot-version: *godot_version

  test-editor-monkey:
    name: 🐒 Editor monkey
    needs: build-linux
    uses: ./.github/workflows/test_editor_monkey.yml
    with:
      godot-version: *godot_version

  assemble-addon:
    name: 📦 Assemble addon
    needs: [assemble-android, test-desktop, test-ios, test-editor-monkey]
    uses: ./.github/workflows/assemble_addon.yml

  release:
    name: 🚀 Publish release
    needs: [check-specs, assemble-addon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: fmod-addon
          path: package

      - name: Zip addon
        run: cd package && zip -r ../addons.zip addons

      # The demo project with the released addon, without the tests and their tooling.
      - name: Zip demo project
        run: |
          rm -rf demo/addons/fmod demo/addons/gdUnit4 demo/test demo/test_runner demo/editor_monkey demo/run_tests.sh
          cp -R package/addons/fmod demo/addons/fmod
          sed -i 's|, "res://addons/gdUnit4/plugin.cfg"||' demo/project.godot
          cd demo
          zip -r ../demo.zip . -x '*/.gitignore' '.gitignore' '.godot/*' 'export/*' 'reports/*' 'android/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" addons.zip demo.zip --title "Release $GITHUB_REF_NAME" --verify-tag
