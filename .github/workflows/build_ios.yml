name: 🍏 iOS Builds
on:
  workflow_call:
    inputs:
      fmod-version:
        type: string
        required: true

jobs:
  build-ios:
    runs-on: macos-15
    name: ${{ matrix.target }}
    permissions:
      contents: read
      actions: write
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/scons-cache
        with:
          mode: restore
          name: ios-${{ matrix.target }}
      - uses: ./.github/actions/gdextension-build
        with:
          platform: ios
          target: ${{ matrix.target }}
          scons-flags: arch=arm64
          fmod-version: ${{ inputs.fmod-version }}
          fmod-user: ${{ secrets.FMODUSER }}
          fmod-password: ${{ secrets.FMODPASS }}
      - uses: ./.github/actions/scons-cache
        if: always()
        with:
          mode: save
          name: ios-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_ios
          path: |
            demo/addons/fmod/libs/ios
            !demo/addons/fmod/libs/ios/CopyPast_Fmod_Libs_Here.txt
          if-no-files-found: error
