name: Master-only cache
description: >
  Restores a cache entry by exact key. Only a master run (the daily scheduled one) saves it back, deleting the previous
  entry first, so the repository keeps exactly one entry per key and other branches only read. Not called by workflows
  directly: the scons-cache and gradle-deps-cache actions own their paths and keys and delegate here.
inputs:
  mode:
    description: "'restore' (before the build) or 'save' (after the build)."
    required: true
  key:
    description: Exact cache key. Must be unique per writing job.
    required: true
  path:
    description: Paths to cache, one per line.
    required: true

runs:
  using: composite
  steps:
    - name: Restore cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        enableCrossOsArchive: true

    - name: Delete master's previous cache
      if: inputs.mode == 'save' && github.ref == 'refs/heads/master'
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method DELETE "repos/${{ github.repository }}/actions/caches?key=${{ inputs.key }}&ref=${{ github.ref }}" --silent || true

    - name: Save cache
      if: inputs.mode == 'save' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        enableCrossOsArchive: true
