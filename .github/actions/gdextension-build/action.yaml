name: Build GDExtension
description: Installs FMOD and SCons, then compiles the extension into demo/addons/fmod/libs/<platform>/.
inputs:
  platform:
    required: true
  target:
    required: true
  scons-flags:
    default: ''
  fmod-version:
    required: true
  fmod-user:
    required: true
  fmod-password:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install scons
    - uses: ./.github/actions/install-fmod
      with:
        platform: ${{ inputs.platform }}
        fmod-version: ${{ inputs.fmod-version }}
        fmod-user: ${{ inputs.fmod-user }}
        fmod-password: ${{ inputs.fmod-password }}
    - name: Compile GDExtension
      shell: bash
      run: scons platform=${{ inputs.platform }} target=${{ inputs.target }} -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")" ${{ inputs.scons-flags }}
